services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./backend
    environment:
      - SERVER_ID=backend-1
      - PORT=3000
    networks:
      - app-network

  backend2:
    build: ./backend
    environment:
      - SERVER_ID=backend-2
      - PORT=3000
    networks:
      - app-network

  backend3:
    build: ./backend
    environment:
      - SERVER_ID=backend-3-backup
      - PORT=3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge